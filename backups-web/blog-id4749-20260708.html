
<style>
.bl-root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1F2937;margin:0;padding:0;overflow-x:hidden}
.bl-root *{box-sizing:border-box}
.bl-root a{text-decoration:none}
:root{--bl-blue:#1B5E9B;--bl-blue-dark:#0D3B6E;--bl-blue-light:#4A90D9;--bl-blue-pale:#C8DCF0;--bl-bg:#F4F7FA;--bl-orange:#F97316}

.bl-hero{background:linear-gradient(135deg,#0D3B6E 0%,#1B5E9B 60%,#2563AB 100%);padding:3.5rem 2rem 3rem;text-align:center;position:relative;overflow:hidden}
.bl-hero::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(255,255,255,.04);top:-200px;right:-100px;pointer-events:none}
.bl-hero-inner{position:relative;z-index:1}
.bl-hero h1{font-size:clamp(1.8rem,3vw,2.8rem);font-weight:900;color:#fff!important;margin:0 0 .6rem;letter-spacing:-.02em}
.bl-hero-lead{color:rgba(255,255,255,.78);font-size:1rem;margin:0}

.bl-filters{background:#fff;border-bottom:2px solid #E5ECF4;padding:.1rem 2rem;position:sticky;top:32px;z-index:100;box-shadow:0 2px 12px rgba(13,59,110,.06)}
.bl-filters-inner{max-width:1200px;margin:0 auto;display:flex;gap:.4rem;flex-wrap:wrap;padding:.6rem 0}
.bl-filter-btn{background:transparent;border:1.5px solid #D1DCE8;border-radius:6px;padding:.45rem 1.1rem;font-size:.85rem;font-weight:600;color:#4B5563;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.bl-filter-btn:hover{border-color:var(--bl-blue-light);color:var(--bl-blue)}
.bl-filter-btn.bl-active{background:var(--bl-blue);border-color:var(--bl-blue);color:#fff}

.bl-grid-wrap{background:var(--bl-bg);padding:3rem 2rem 4rem}
.bl-grid-inner{max-width:1200px;margin:0 auto}
.bl-count{font-size:.82rem;color:#6B7280;margin-bottom:1.5rem;font-weight:500}
.bl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}

.bl-card{background:#fff;border-radius:14px;overflow:hidden;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(13,59,110,.07)}
.bl-card:hover{transform:translateY(-5px);box-shadow:0 12px 32px rgba(13,59,110,.13)}
.bl-card-img{aspect-ratio:16/9;overflow:hidden;background:#E5ECF4;position:relative}
.bl-card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.bl-card:hover .bl-card-img img{transform:scale(1.05)}
.bl-card-no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#E8F0FA,#C8DCF0)}
.bl-card-no-img svg{opacity:.3}
.bl-card-body{padding:1.2rem;flex:1;display:flex;flex-direction:column;gap:.5rem}
.bl-card-cat{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bl-blue-light)}
.bl-card-title{font-size:.97rem;font-weight:700;color:var(--bl-blue-dark)!important;line-height:1.4;margin:0;flex:1}
.bl-card-title a{color:var(--bl-blue-dark)!important}
.bl-card-title a:hover{color:var(--bl-blue)!important}
.bl-card-meta{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem}
.bl-card-date{font-size:.76rem;color:#9CA3AF}
.bl-card-link{font-size:.78rem;font-weight:700;color:var(--bl-blue)!important;display:inline-flex;align-items:center;gap:.3rem;transition:gap .2s}
.bl-card-link:hover{gap:.6rem}

.bl-empty{text-align:center;padding:4rem 2rem;color:#9CA3AF;grid-column:1/-1}
.bl-empty svg{opacity:.3;margin-bottom:1rem}
.bl-empty p{margin:0;font-size:.95rem}

.bl-load-more{text-align:center;margin-top:2.5rem}
.bl-load-btn{background:#fff;border:2px solid var(--bl-blue);color:var(--bl-blue)!important;padding:.85rem 2.5rem;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:.5rem}
.bl-load-btn:hover{background:var(--bl-blue);color:#fff!important}
.bl-load-btn:disabled{opacity:.5;cursor:not-allowed}
.bl-spinner{display:none;width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:bl-spin .7s linear infinite}
@keyframes bl-spin{to{transform:rotate(360deg)}}

@keyframes bl-fade-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.bl-card{animation:bl-fade-up .4s ease both}

@media(max-width:1024px){.bl-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.bl-grid{grid-template-columns:repeat(2,1fr)}.bl-filters{top:0}}
@media(max-width:480px){.bl-grid{grid-template-columns:1fr}}
</style>

<div class="bl-root" id="bl-root">

<div class="bl-hero">
  <div class="bl-hero-inner">
    <h1>Blog de Ciclismo</h1>
    <p class="bl-hero-lead">Entrenamientos, fisiología, nutrición y noticias para mejorar tu rendimiento en bici.</p>
  </div>
</div>

<div class="bl-filters">
  <div class="bl-filters-inner" id="bl-filters">
    <button class="bl-filter-btn bl-active" data-cat="0">Todas</button>
  </div>
</div>

<div class="bl-grid-wrap">
  <div class="bl-grid-inner">
    <div class="bl-count" id="bl-count"></div>
    <div class="bl-grid" id="bl-grid">
      <div style="grid-column:1/-1;text-align:center;padding:3rem;color:#9CA3AF">Cargando artículos…</div>
    </div>
    <div class="bl-load-more" id="bl-load-more" style="display:none">
      <button class="bl-load-btn" id="bl-load-btn">
        <span class="bl-spinner" id="bl-spinner"></span>
        <span id="bl-load-txt">Cargar más artículos</span>
      </button>
    </div>
  </div>
</div>

</div>

<script>
(function(){
'use strict';
var API = '/wp-json/wp/v2';
var PER_PAGE = 12;
var allPosts = [];
var categories = {};
var activeCat = 0;
var currentPage = 1;
var totalPages = 1;
var loading = false;

var grid = document.getElementById('bl-grid');
var filtersEl = document.getElementById('bl-filters');
var countEl = document.getElementById('bl-count');
var loadMore = document.getElementById('bl-load-more');
var loadBtn = document.getElementById('bl-load-btn');
var spinner = document.getElementById('bl-spinner');
var loadTxt = document.getElementById('bl-load-txt');

// Fetch categories first
fetch(API + '/categories?per_page=20&hide_empty=true')
  .then(function(r){return r.json();})
  .then(function(cats){
    cats.forEach(function(c){categories[c.id] = c;});
    // Add category buttons
    cats.sort(function(a,b){return b.count - a.count;});
    cats.forEach(function(c){
      var btn = document.createElement('button');
      btn.className = 'bl-filter-btn';
      btn.setAttribute('data-cat', c.id);
      btn.textContent = c.name + ' (' + c.count + ')';
      btn.addEventListener('click', function(){filterBy(c.id);});
      filtersEl.appendChild(btn);
    });
    // Initial load
    loadPosts(1);
  });

document.querySelector('[data-cat="0"]').addEventListener('click', function(){filterBy(0);});

function filterBy(catId){
  if(activeCat === catId) return;
  activeCat = catId;
  currentPage = 1;
  allPosts = [];
  // Update active button
  document.querySelectorAll('.bl-filter-btn').forEach(function(b){
    b.classList.toggle('bl-active', parseInt(b.getAttribute('data-cat')) === catId);
  });
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#9CA3AF">Cargando…</div>';
  loadMore.style.display = 'none';
  loadPosts(1);
}

function loadPosts(page){
  if(loading) return;
  loading = true;
  spinner.style.display = 'block';
  loadBtn.disabled = true;
  loadTxt.textContent = 'Cargando…';

  var url = API + '/posts?per_page=' + PER_PAGE + '&page=' + page + '&_embed=1&status=publish';
  if(activeCat) url += '&categories=' + activeCat;

  fetch(url)
    .then(function(r){
      totalPages = parseInt(r.headers.get('X-WP-TotalPages') || '1');
      var total = parseInt(r.headers.get('X-WP-Total') || '0');
      countEl.textContent = total + ' artículo' + (total !== 1 ? 's' : '');
      return r.json();
    })
    .then(function(posts){
      loading = false;
      spinner.style.display = 'none';
      loadBtn.disabled = false;
      loadTxt.textContent = 'Cargar más artículos';
      currentPage = page;

      if(page === 1) {
        allPosts = posts;
        renderGrid(allPosts);
      } else {
        allPosts = allPosts.concat(posts);
        appendPosts(posts);
      }

      loadMore.style.display = currentPage < totalPages ? 'block' : 'none';
    })
    .catch(function(){
      loading = false;
      grid.innerHTML = '<div class="bl-empty"><p>Error al cargar los artículos. Recarga la página.</p></div>';
    });
}

loadBtn.addEventListener('click', function(){
  loadPosts(currentPage + 1);
});

function formatDate(str){
  var d = new Date(str);
  return d.toLocaleDateString('es-ES', {day:'numeric', month:'long', year:'numeric'});
}

function getCatName(ids){
  if(!ids || !ids.length) return '';
  return categories[ids[0]] ? categories[ids[0]].name : '';
}

function getImg(post){
  var media = post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0];
  if(media && media.source_url) {
    // Use medium size if available
    var sizes = media.media_details && media.media_details.sizes;
    var src = (sizes && sizes.medium_large && sizes.medium_large.source_url) || 
              (sizes && sizes.large && sizes.large.source_url) || 
              media.source_url;
    return '<img decoding="async" src="' + src + '" alt="' + (media.alt_text || '') + '" loading="lazy"/>';
  }
  return '<div class="bl-card-no-img"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1B5E9B" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 16 5-5 4 4 3-3 5 5"/><circle cx="8.5" cy="8.5" r="1.5"/></svg></div>';
}

function cardHTML(post, delay){
  var cat = getCatName(post.categories);
  var title = post.title.rendered;
  var excerpt = post.excerpt.rendered.replace(/<[^>]+>/g,'').substring(0,120).trim();
  if(excerpt.length === 120) excerpt += '…';
  var date = formatDate(post.date);
  var link = post.link;
  var img = getImg(post);
  return '<div class="bl-card" style="animation-delay:' + (delay * 60) + 'ms"><a href="' + link + '">' +
    '<div class="bl-card-img">' + img + '</div>' +
    '</a><div class="bl-card-body">' +
    (cat ? '<span class="bl-card-cat">' + cat + '</span>' : '') +
    '<h2 class="bl-card-title"><a href="' + link + '">' + title + '</a></h2>' +
    '<div class="bl-card-meta"><span class="bl-card-date">' + date + '</span>' +
    '<a class="bl-card-link" href="' + link + '">Leer →</a>' +
    '</div></div></div>';
}

function renderGrid(posts){
  if(!posts.length){
    grid.innerHTML = '<div class="bl-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-3-3v6m9-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p>No hay artículos en esta categoría todavía.</p></div>';
    return;
  }
  grid.innerHTML = posts.map(function(p,i){return cardHTML(p,i);}).join('');
}

function appendPosts(posts){
  var startDelay = allPosts.length - posts.length;
  grid.insertAdjacentHTML('beforeend', posts.map(function(p,i){return cardHTML(p, i);}).join(''));
}

})();
</script>
