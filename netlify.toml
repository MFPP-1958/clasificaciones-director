[build]
  command   = "node build.js"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "18"

# ─── Cache-Control por defecto: NUNCA cachear ─────────────────────────────
# Aplicamos no-cache global. Las reglas específicas para assets versionados
# (más abajo) anularán esto para CSS/JS que llevan ?v=hash y pueden cachearse
# durante 1 año sin riesgo. En Netlify la regla más específica gana.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Cache-Control          = "no-cache, no-store, must-revalidate"
    Pragma                 = "no-cache"
    Expires                = "0"

# ─── Assets con cache busting: cachear 1 año (immutable) ──────────────────
# Como las URLs llevan ?v=HASH del contenido, cuando cambia el archivo cambia
# el hash → URL "nueva" para el navegador → descarga inevitable. Es seguro
# cachearlos durante 1 año.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Ranking público embebible ────────────────────────────────────────────
# Solo mfppcycling.com (y este propio dominio) pueden incrustarlo en iframe.
# frame-ancestors sustituye a X-Frame-Options: cuando ambos llegan al
# navegador, este obedece frame-ancestors e ignora XFO.
[[headers]]
  for = "/ranking/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://mfppcycling.com https://www.mfppcycling.com"
